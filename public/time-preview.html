<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150c2c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<title>تحدي الوقت · كل الصور</title>
</head>
<body>
<main class="app" id="app"><p class="loading">جاري تحميل الفئات…</p></main>
<script src="/js/common.js"></script>
<script src="/js/time-ui.js"></script>
<script>
/* global $, h, toast, cardFace */
'use strict';

// Every «تحدي الوقت» card with its answer, so the host can check the
// pictures before a game. «افحص كل الصور» lists pictures that don't open.

const app = $('#app');
let categories = [];
let current = null;
const broken = new Map(); // src → { category, card }

const isRemote = (card) => card.type === 'image' || card.type === 'map';

async function load() {
  try {
    const res = await fetch('/time-challenge.json');
    ({ categories } = await res.json());
  } catch {
    app.replaceChildren(h('p', { class: 'banner bad' }, 'ما قدرنا نحمّل الفئات، حدّث الصفحة'));
    return;
  }
  current = categories.find((c) => c.id === location.hash.slice(1)) ?? categories[0];
  render();
}

function markBroken(category, card) {
  broken.set(card.src, { category, card });
  updateBrokenList();
}

function render() {
  const total = categories.reduce((n, c) => n + c.cards.length, 0);
  app.replaceChildren(
    h('header', { class: 'topbar' },
      h('div', { class: 'brand' }, 'تحدي الوقت ⏱️ · كل الصور'),
      h('div', { class: 'pill' }, `${categories.length} فئة · ${total} بطاقة`),
    ),
    h('section', { class: 'card' },
      h('p', {}, 'هنا كل البطاقات وأجوبتها. لو فيه صورة غلط أو ما تفتح، صوّرها وأرسلها عشان نصلحها.'),
      h('div', { class: 'preview-check' },
        h('button', { id: 'check', class: 'btn primary', onclick: checkAll }, '🔍 افحص كل الصور'),
        h('span', { id: 'check-progress', class: 'muted' }),
      ),
      h('div', { id: 'broken' }),
    ),
    h('nav', { class: 'preview-cats' }, h('div', { class: 'chips' }, categories.map((c) => h('button', {
      type: 'button',
      class: `category-chip${c === current ? ' picked' : ''}`,
      onclick: () => {
        current = c;
        history.replaceState(null, '', `#${c.id}`);
        render();
      },
    }, h('span', {}, c.emoji), h('span', {}, c.name), h('small', { class: 'category-count' }, c.cards.length))))),
    h('h2', {}, `${current.emoji} ${current.name}`),
    h('div', { class: 'preview-grid' }, current.cards.map((card, i) => {
      const item = h('figure', { class: `preview-item${broken.has(card.src) ? ' broken' : ''}` },
        cardFace(card, {
          reveal: true,
          lazy: true,
          onBroken: () => {
            item.classList.add('broken');
            markBroken(current, card);
          },
        }),
        h('figcaption', {}, h('b', {}, `${i + 1}. ${card.answer}`), card.alt ? h('small', {}, card.alt) : null),
      );
      return item;
    })),
  );
  app.querySelector('.preview-cats .picked')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  updateBrokenList();
}

function updateBrokenList() {
  const box = $('#broken');
  if (!box) return;
  if (!broken.size) {
    box.replaceChildren();
    return;
  }
  const lines = [...broken.values()].map(({ category, card }) => `${category.name}: ${card.answer}${card.alt ? ` (${card.alt})` : ''}`);
  box.replaceChildren(
    h('p', { class: 'banner bad' }, `${broken.size} صورة ما فتحت`),
    h('ul', { class: 'broken-list' }, lines.map((line) => h('li', {}, line))),
    h('button', {
      class: 'btn small',
      onclick: async () => {
        try {
          await navigator.clipboard.writeText(lines.join('\n'));
          toast('انتسخت القائمة', 'ok');
        } catch {
          toast('ما قدرنا ننسخ، صوّر الشاشة');
        }
      },
    }, '📋 انسخ القائمة'),
  );
}

/** Loads every remote picture, a few at a time, and lists the ones that fail. */
async function checkAll() {
  const button = $('#check');
  button.disabled = true;
  const jobs = categories.flatMap((category) => category.cards.filter(isRemote).map((card) => ({ category, card })));
  let done = 0;
  const progress = () => { $('#check-progress').textContent = `${done}/${jobs.length}`; };
  progress();
  const queue = [...jobs];
  const worker = async () => {
    while (queue.length) {
      const { category, card } = queue.shift();
      const ok = await new Promise((resolve) => {
        const img = new Image();
        img.referrerPolicy = 'no-referrer';
        img.onload = () => resolve(img.naturalWidth > 0);
        img.onerror = () => resolve(false);
        img.src = card.src;
      });
      if (!ok) markBroken(category, card);
      done += 1;
      progress();
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  $('#check-progress').textContent = broken.size ? `خلص الفحص · ${broken.size} صورة ما فتحت` : '✅ كل الصور تفتح';
  button.disabled = false;
}

load();
</script>
</body>
</html>
