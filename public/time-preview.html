<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150c2c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<title>تحدي الوقت · كل الصور</title>
</head>
<body>
<main class="app" id="app"><p class="loading">جاري تحميل الفئات…</p></main>
<script src="/js/common.js"></script>
<script src="/js/teams-ui.js"></script>
<script src="/js/time-ui.js"></script>
<script>
/* global $, h, toast, storage, cardFace */
'use strict';

// Every «تحدي الوقت» card with its answer. <svg class="icon" aria-hidden="true"><use href="/icons.svg#i-ban"/></svg> takes a card out of the games
// hosted on this device (the host screen reads the same list).

const app = $('#app');
const EXCLUDED_KEY = 'tc:excluded';
let categories = [];
let current = null;

const keyOf = (category, card) => `${category.id}:${card.answer}`;
const excludedKeys = () => new Set(storage(EXCLUDED_KEY) ?? []);

function setExcluded(key, on) {
  const keys = excludedKeys();
  if (on) keys.add(key);
  else keys.delete(key);
  storage(EXCLUDED_KEY, [...keys]);
  render();
}

async function load() {
  try {
    const res = await fetch('/time-challenge.json');
    ({ categories } = await res.json());
  } catch {
    app.replaceChildren(h('p', { class: 'banner bad' }, 'ما قدرنا نحمّل الفئات، حدّث الصفحة'));
    return;
  }
  current = categories.find((c) => c.id === location.hash.slice(1)) ?? categories[0];
  render();
  if (location.hash === '#excluded') $('#excluded')?.scrollIntoView();
}

function excludedSection(keys) {
  if (!keys.size) return null;
  const rows = categories.flatMap((c) => c.cards.filter((card) => keys.has(keyOf(c, card))).map((card) => ({ c, card })));
  const lines = rows.map(({ c, card }) => `${c.name}: ${card.answer}`);
  return h('section', { class: 'card', id: 'excluded' },
    h('h2', {}, `<svg class="icon" aria-hidden="true"><use href="/icons.svg#i-ban"/></svg> الصور المستبعدة من هالجهاز (${rows.length})`),
    h('p', { class: 'hint' }, 'ما تطلع في الألعاب اللي تستضيفها من هالجهاز. أرسل القائمة عشان أشيلها من اللعبة نهائياً.'),
    h('ul', { class: 'broken-list' }, rows.map(({ c, card }) => h('li', {},
      `${c.emoji} ${c.name}: `, h('b', {}, card.answer), ' ',
      h('button', { class: 'link-btn small', onclick: () => setExcluded(keyOf(c, card), false) }, 'رجّعها')))),
    h('button', {
      class: 'btn small',
      onclick: async () => {
        try {
          await navigator.clipboard.writeText(lines.join('\n'));
          toast('انتسخت القائمة', 'ok');
        } catch {
          toast('ما قدرنا ننسخ، صوّر الشاشة');
        }
      },
    }, '<svg class="icon" aria-hidden="true"><use href="/icons.svg#i-clipboard-copy"/></svg> انسخ القائمة'),
  );
}

function render() {
  const keys = excludedKeys();
  const total = categories.reduce((n, c) => n + c.cards.length, 0);
  app.replaceChildren(
    h('header', { class: 'topbar' },
      h('div', { class: 'brand' }, 'تحدي الوقت <svg class="icon" aria-hidden="true"><use href="/icons.svg#i-timer"/></svg> · كل الصور'),
      h('div', { class: 'pill' }, `${categories.length} فئة · ${total} بطاقة`),
    ),
    h('section', { class: 'card' },
      h('p', {}, 'هنا كل البطاقات وأجوبتها. لو فيه صورة غلط أو تفضح الجواب، اضغط <svg class="icon" aria-hidden="true"><use href="/icons.svg#i-ban"/></svg> عليها وما راح تطلع في الألعاب اللي تستضيفها من هالجهاز.'),
      h('p', { class: 'hint' }, 'وأثناء اللعب، المضيف يقدر يضغط «<svg class="icon" aria-hidden="true"><use href="/icons.svg#i-ban"/></svg> استبعد الصورة» وتتبدل بدون ما ينخصم وقت.'),
    ),
    excludedSection(keys),
    h('nav', { class: 'preview-cats' }, h('div', { class: 'chips' }, categories.map((c) => h('button', {
      type: 'button',
      class: `category-chip${c === current ? ' picked' : ''}`,
      onclick: () => {
        current = c;
        history.replaceState(null, '', `#${c.id}`);
        render();
      },
    }, h('span', {}, c.emoji), h('span', {}, c.name), h('small', { class: 'category-count' }, c.cards.length))))),
    h('h2', {}, `${current.emoji} ${current.name}`),
    h('div', { class: 'preview-grid' }, current.cards.map((card, i) => {
      const key = keyOf(current, card);
      const out = keys.has(key);
      const item = h('figure', { class: `preview-item${out ? ' excluded' : ''}` },
        cardFace(card, { reveal: true, lazy: true, onBroken: () => item.classList.add('broken') }),
        h('figcaption', {},
          h('b', {}, `${i + 1}. ${card.answer}`),
          card.alt ? h('small', {}, card.alt) : null,
          h('button', {
            class: `exclude-btn${out ? ' on' : ''}`,
            'aria-pressed': String(out),
            title: out ? 'رجّعها للعبة' : 'استبعدها من اللعبة',
            onclick: () => setExcluded(key, !out),
          }, out ? '<svg class="icon" aria-hidden="true"><use href="/icons.svg#i-undo-2"/></svg> رجّعها' : '<svg class="icon" aria-hidden="true"><use href="/icons.svg#i-ban"/></svg> استبعد'),
        ),
      );
      return item;
    })),
  );
  app.querySelector('.preview-cats .picked')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

load();
</script>
</body>
</html>
